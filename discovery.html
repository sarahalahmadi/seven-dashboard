<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SEVEN Discovery</title>
<link rel="icon" href="logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="seven.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<div class="brand-rule"></div>

<header class="top">
  <div class="brand">
    <img src="logo.png" alt="SEVEN" />
    <span class="divider"></span>
    <div class="name"><b>SEVEN</b> DISCOVERY</div>
  </div>
  <div class="top-actions">
    <a class="btn ghost" href="home.html"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H6"/><path d="M11.5 5.5L5 12l6.5 6.5"/></svg> All dashboards</a>
    <button class="btn" id="print-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9V4h10v5"/><path d="M7 18H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/><rect x="7" y="14" width="10" height="7" rx="1"/></svg> Print / PDF</button>
    <button class="btn primary" id="upload-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="M7.5 8.5L12 4l4.5 4.5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg> Open a file</button>
    <input type="file" id="file-input" accept=".xlsx,.xls,.csv" style="display:none" />
  </div>
</header>

<main>
  <div id="empty-state">
    <div id="drop-zone">
      <img class="drop-mark" src="logo.png" alt="" />
      <h2 class="display">Drop any spreadsheet here</h2>
      <p>Excel or CSV. Recognised files get a dedicated template &mdash; maintenance, certification and more. Anything else gets a general dashboard.</p>
      <button class="btn primary" onclick="document.getElementById('file-input').click()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="M7.5 8.5L12 4l4.5 4.5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg> Choose a file</button>
    </div>
    <div class="hint">Your file stays on your computer. Works best with one header row and one record per row.</div>
  </div>

  <div id="board" style="display:none">
    <div class="title-row">
      <input id="board-title" class="board-title" placeholder="Name this dashboard" spellcheck="false" />
    </div>

    <div class="file-bar">
      <div class="file-chip"><span class="dot"></span><span id="file-name" class="mono">&mdash;</span></div>
      <div class="file-chip" id="template-chip" style="display:none"><span id="template-name"></span></div>
      <div class="ctrl-group" id="sheet-wrap" style="display:none">
        <label>Sheet</label>
        <select class="pill" id="sheet-select"></select>
      </div>
      <div class="spacer"></div>
      <button class="btn ghost" id="reset-btn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12a8.5 8.5 0 1 1-2.5-6"/><path d="M20.5 4v5.5H15"/></svg> Auto-rebuild</button>
      <button class="btn primary" id="add-chart-btn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg> Add chart</button>
    </div>

    <div id="chart-grid"></div>
  </div>
</main>

<div id="editor-modal">
  <div class="modal-card">
    <h2 id="editor-heading">Add chart</h2>
    <div id="editor-form"></div>
    <div class="modal-actions">
      <button class="btn ghost" id="editor-cancel">Cancel</button>
      <button class="btn primary" id="editor-save">Save chart</button>
    </div>
  </div>
</div>

<script src="engine.js"></script>
<script src="discovery.js"></script>
</body>
</html>
