<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SEVEN Discovery</title>
<link rel="icon" href="logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="seven.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body style="--accent:var(--cyan)">


<header class="top">
  <nav class="brand" aria-label="Breadcrumb">
    <a class="brand-home" href="index.html" title="All dashboards">
      <img src="logo.png" alt="SEVEN" />
      <span class="brand-word">SEVEN</span>
    </a>
    <span class="brand-sep" aria-hidden="true">/</span>
    <div class="switcher">
      <button type="button" class="switch-btn" id="switch-btn"
              aria-haspopup="true" aria-expanded="false" aria-controls="switch-menu">
        <span>Discovery</span><svg class="switch-chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9.5l6 6 6-6"/></svg>
      </button>
      <div class="switch-menu" id="switch-menu" role="menu" aria-label="Go to dashboard">
        <a class="switch-all" href="index.html" role="menuitem"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="3.5" width="7.5" height="7.5" rx="1.6"/><rect x="3" y="13" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="13" width="7.5" height="7.5" rx="1.6"/></svg><span>All dashboards</span></a>
        <div class="switch-rule" role="separator"></div>
          <a class="switch-item" href="critical-path.html" role="menuitem" style="--dot:var(--magenta)"><span class="switch-dot"></span><span>Critical Path</span></a>
          <a class="switch-item" href="visualizer.html" role="menuitem" style="--dot:var(--amber)"><span class="switch-dot"></span><span>Visualizer</span></a>
          <a class="switch-item current" href="discovery.html" role="menuitem" aria-current="page" style="--dot:var(--cyan)"><span class="switch-dot"></span><span>Discovery</span><svg class="switch-tick" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></a>
      </div>
    </div>
  </nav>
  <div class="top-actions">
    <button class="btn" id="print-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9V4h10v5"/><path d="M7 18H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/><rect x="7" y="14" width="10" height="7" rx="1"/></svg> Print / PDF</button>
    <button class="btn primary" id="upload-btn" style="display:none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="M7.5 8.5L12 4l4.5 4.5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg> Open a file</button>
    <input type="file" id="file-input" accept=".xlsx,.xls,.csv" style="display:none" />
  </div>
</header>

<main>
    <div id="empty-state">
      <div id="drop-zone" class="starter">
    <div class="starter-main">
      <span class="eyebrow">Start here</span>
      <h2 class="display">Open a Discovery file</h2>
      <p>Recognised files get a template built for them.</p>
      <button class="btn primary" onclick="document.getElementById('file-input').click()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="M7.5 8.5L12 4l4.5 4.5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg> Choose a file</button>
    </div>
    <div class="starter-art">
      <svg viewBox="0 0 220 150" role="img" aria-label="Certification checks, with one renewal coming due">
        <rect x="6" y="6" width="208" height="138" rx="9" fill="var(--surface)" stroke="var(--line)"/>
        <rect x="18" y="20" width="184" height="9" rx="4.5" fill="var(--surface-sunk)"/>
        <rect class="art-lane" x="18" y="20" width="132" height="9" rx="4.5" fill="var(--accent)"/>
        <g class="art-rows">
          <g class="art-row">
            <rect x="18" y="48" width="16" height="16" rx="4" fill="none" stroke="var(--green)" stroke-width="1.6"/>
            <path class="art-tick" d="M22 56.5 L25.5 60 L30.5 52.5" fill="none" stroke="var(--green)"
                  stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="42" y="52" width="104" height="8" rx="3" fill="var(--line)"/>
          </g>
          <g class="art-row">
            <rect x="18" y="76" width="16" height="16" rx="4" fill="none" stroke="var(--green)" stroke-width="1.6"/>
            <path class="art-tick" d="M22 84.5 L25.5 88 L30.5 80.5" fill="none" stroke="var(--green)"
                  stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <rect x="42" y="80" width="80" height="8" rx="3" fill="var(--line)"/>
          </g>
          <g class="art-row">
            <rect x="18" y="104" width="16" height="16" rx="4" fill="none" stroke="var(--coral)" stroke-width="1.6"/>
            <circle class="art-pulse" cx="26" cy="112" r="3.2" fill="var(--coral)"/>
            <rect x="42" y="108" width="92" height="8" rx="3" fill="var(--line)"/>
            <rect x="152" y="106" width="46" height="12" rx="6" fill="var(--coral)" opacity=".16"/>
            <rect x="158" y="110" width="34" height="4" rx="2" fill="var(--coral)" opacity=".75"/>
          </g>
        </g>
      </svg>
    </div>
    <div class="starter-tags">
      <span class="tag"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.2"/><path d="M3 9.2h18"/><path d="M9.4 9.2V20"/></svg><span>Templates</span></span>
      <span class="tag"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.2l7.4 2.9v5.4c0 4.4-3 7.9-7.4 9.3-4.4-1.4-7.4-4.9-7.4-9.3V6.1z"/><path d="M8.9 12.1l2.4 2.4 4-4.4"/></svg><span>Compliance</span></span>
      <span class="tag"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.4 12a8.4 8.4 0 1 1-2.5-6"/><path d="M20.4 4.2v5.4H15"/></svg><span>Renewals</span></span>
      <span class="tag"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4.2l8.8 14.6H3.2z"/><path d="M12 10v3.9"/><path d="M12 16.5v.1"/></svg><span>Overdue</span></span>
      <span class="tag"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.6" cy="10.6" r="6.4"/><path d="M19.8 19.8l-4.6-4.6"/></svg><span>Findings</span></span>
    </div>
      </div>
    </div>

    <div id="board" style="display:none">
    <div class="title-row">
      <input id="board-title" class="board-title" placeholder="Name this dashboard" spellcheck="false" />
    </div>

    <div class="file-bar">
      <div class="file-chip"><span class="dot"></span><span id="file-name" class="mono"></span></div>
      <div class="file-chip" id="template-chip" style="display:none"><span id="template-name"></span></div>
      <div class="ctrl-group" id="sheet-wrap" style="display:none">
        <label>Sheet</label>
        <select class="pill" id="sheet-select"></select>
      </div>
      <div class="spacer"></div>
      <button class="btn ghost" id="reset-btn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12a8.5 8.5 0 1 1-2.5-6"/><path d="M20.5 4v5.5H15"/></svg> Rebuild</button>
      <button class="btn primary" id="add-chart-btn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg> Add chart</button>
    </div>

    <div id="chart-grid"></div>
  </div>
</main>

<div id="editor-modal">
  <div class="modal-card">
    <h2 id="editor-heading">Add chart</h2>
    <div id="editor-form"></div>
    <div class="modal-actions">
      <button class="btn ghost" id="editor-cancel">Cancel</button>
      <button class="btn primary" id="editor-save">Save chart</button>
    </div>
  </div>
</div>

<script src="engine.js"></script>
<script src="discovery.js"></script>
<script src="nav.js"></script>
<script src="tooltip.js"></script>
</body>
</html>
