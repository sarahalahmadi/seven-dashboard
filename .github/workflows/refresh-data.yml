name: Refresh live data

# Runs on a schedule, and can also be started by hand from the
# repo's Actions tab (Run workflow).
on:
  schedule:
    # Every day at 03:00 UTC (06:00 in Riyadh). Change to taste:
    #   "0 */6 * * *"  = every 6 hours
    #   "0 3 * * 0"    = weekly, Sunday 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the latest rows from SeaTable
        env:
          SEATABLE_SERVER: ${{ secrets.SEATABLE_SERVER }}
          SEATABLE_TOKEN: ${{ secrets.SEATABLE_TOKEN }}
          SEATABLE_TABLE: ${{ secrets.SEATABLE_TABLE }}
          OUTPUT_PATH: data/live.json
        run: python scripts/fetch_seatable.py

      - name: Commit the snapshot if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/live.json; then
            echo "No change since the last run."
          else
            git add data/live.json
            git commit -m "Refresh live data ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
          fi
