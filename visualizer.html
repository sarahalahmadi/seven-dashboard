<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SEVEN Visualizer</title>
<link rel="icon" href="logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="seven.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body style="--accent:var(--amber)">


<header class="top">
  <nav class="brand" aria-label="Breadcrumb">
    <a class="brand-home" href="index.html" title="All dashboards">
      <img src="logo.png" alt="SEVEN" />
      <span class="brand-word">SEVEN</span>
    </a>
    <span class="brand-sep" aria-hidden="true">/</span>
    <div class="switcher">
      <button type="button" class="switch-btn" id="switch-btn"
              aria-haspopup="true" aria-expanded="false" aria-controls="switch-menu">
        <span>Visualizer</span><svg class="switch-chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9.5l6 6 6-6"/></svg>
      </button>
      <div class="switch-menu" id="switch-menu" role="menu" aria-label="Go to dashboard">
        <a class="switch-all" href="index.html" role="menuitem"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="3.5" width="7.5" height="7.5" rx="1.6"/><rect x="3" y="13" width="7.5" height="7.5" rx="1.6"/><rect x="13.5" y="13" width="7.5" height="7.5" rx="1.6"/></svg><span>All dashboards</span></a>
        <div class="switch-rule" role="separator"></div>
          <a class="switch-item" href="critical-path.html" role="menuitem" style="--dot:var(--magenta)"><span class="switch-dot"></span><span>Critical Path</span></a>
          <a class="switch-item current" href="visualizer.html" role="menuitem" aria-current="page" style="--dot:var(--amber)"><span class="switch-dot"></span><span>Visualizer</span><svg class="switch-tick" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></a>
          <a class="switch-item" href="discovery.html" role="menuitem" style="--dot:var(--cyan)"><span class="switch-dot"></span><span>Discovery</span></a>
      </div>
    </div>
  </nav>
  <div class="top-actions">
    <button class="btn" id="print-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9V4h10v5"/><path d="M7 18H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/><rect x="7" y="14" width="10" height="7" rx="1"/></svg> Print / PDF</button>
    <button class="btn primary" id="upload-btn" style="display:none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="M7.5 8.5L12 4l4.5 4.5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg> Open a file</button>
    <input type="file" id="file-input" accept=".xlsx,.xls,.csv" style="display:none" />
  </div>
</header>

<main>
    <div id="empty-state">
      <div id="drop-zone" class="starter">
    <div class="starter-main">
      <span class="eyebrow">Start here</span>
      <h2 class="display">Open any spreadsheet</h2>
      <p>Excel or CSV. Your columns, read as a dashboard.</p>
      <button class="btn primary" onclick="document.getElementById('file-input').click()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4"/><path d="M7.5 8.5L12 4l4.5 4.5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg> Choose a file</button>
    </div>
    <div class="starter-art">
      <svg viewBox="0 0 220 150" role="img" aria-label="A dashboard being built from a spreadsheet">
        <rect x="6" y="6" width="208" height="138" rx="9" fill="var(--surface)" stroke="var(--line)"/>
        <g>
          <rect class="art-kpi" x="18" y="18" width="56" height="20" rx="4" fill="var(--line)" opacity=".75"/>
          <rect class="art-kpi" x="82" y="18" width="56" height="20" rx="4" fill="var(--line)" opacity=".75"/>
          <rect class="art-kpi" x="146" y="18" width="56" height="20" rx="4" fill="var(--line)" opacity=".75"/>
        </g>
        <line x1="18" y1="126" x2="202" y2="126" stroke="var(--line-strong)" stroke-width="1"/>
        <g class="art-bars">
          <rect class="art-bar" x="30" y="80" width="24" height="46" rx="3" fill="var(--cyan)"/>
          <rect class="art-bar" x="66" y="58" width="24" height="68" rx="3" fill="var(--magenta)"/>
          <rect class="art-bar" x="102" y="92" width="24" height="34" rx="3" fill="var(--amber)"/>
          <rect class="art-bar" x="138" y="68" width="24" height="58" rx="3" fill="var(--green)"/>
          <rect class="art-bar" x="174" y="50" width="24" height="76" rx="3" fill="var(--coral)"/>
        </g>
        <path class="art-spark" d="M30 96 L66 74 L102 86 L138 62 L174 44"
              fill="none" stroke="var(--accent)" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round" opacity=".85"/>
        <circle class="art-dot" cx="174" cy="44" r="4.5" fill="var(--accent)"
                stroke="var(--surface)" stroke-width="2"/>
      </svg>
    </div>
    <div class="starter-tags">
      <span class="tag"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="2.2"/><path d="M7 9.5h6" stroke-width="2.6"/><path d="M7 14h9"/></svg><span>Totals</span></span>
      <span class="tag"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V10.5"/><path d="M12 20V4.5"/><path d="M19 20v-6.5"/></svg><span>Breakdowns</span></span>
      <span class="tag"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 16.5l5.2-5.2 3.6 3L20.5 6"/><path d="M15.6 6h4.9v4.9"/></svg><span>Over time</span></span>
      <span class="tag"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.6 5h16.8l-6.5 7.6V20l-3.8-2.4v-5z"/></svg><span>Filtering</span></span>
      <span class="tag"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19.4 8.6a2.1 2.1 0 0 0-3-3L5 17z"/></svg><span>Editable</span></span>
    </div>
      </div>
    </div>

    <div id="board" style="display:none">
    <div class="title-row">
      <input id="board-title" class="board-title" placeholder="Name this dashboard" spellcheck="false" />
    </div>

    <div class="file-bar">
      <div class="file-chip"><span class="dot"></span><span id="file-name" class="mono"></span></div>
      <div class="ctrl-group" id="sheet-wrap" style="display:none">
        <label>Sheet</label>
        <select class="pill" id="sheet-select"></select>
      </div>
      <div class="spacer"></div>
      <button class="btn ghost" id="reset-btn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12a8.5 8.5 0 1 1-2.5-6"/><path d="M20.5 4v5.5H15"/></svg> Rebuild</button>
      <button class="btn primary" id="add-chart-btn"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg> Add chart</button>
    </div>

    <div id="chart-grid"></div>
  </div>
</main>

<div id="editor-modal">
  <div class="modal-card">
    <h2 id="editor-heading">Add chart</h2>
    <div id="editor-form"></div>
    <div class="modal-actions">
      <button class="btn ghost" id="editor-cancel">Cancel</button>
      <button class="btn primary" id="editor-save">Save chart</button>
    </div>
  </div>
</div>

<script src="engine.js"></script>
<script src="visualizer.js"></script>
<script src="nav.js"></script>
</body>
</html>
